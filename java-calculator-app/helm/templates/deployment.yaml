apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-calculator-app
  labels:
    app: java-calculator-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-calculator-app
  template:
    metadata:
      labels:
        app: java-calculator-app
    spec:
      containers:
        - name: java-calculator-app
          image: <JFROG_ARTIFACTORY_URL>/java-calculator-app:<VERSION>
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"